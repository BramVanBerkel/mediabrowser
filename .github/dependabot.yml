version: 2
updates:
  # The browser libraries in web/vendor. A PR here only bumps package.json and
  # the lockfile: check out its branch, run `make vendor` and push the result.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]

  # The actions used in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
