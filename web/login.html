<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Media Browser</title>
<style>
  :root { --bg: #f6f6f4; --surface: #fff; --text: #1d1d1b; --muted: #6b6b66; --border: #e2e2dd; --accent: #2f6fde; --danger: #c4392f; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --surface: #20201e; --text: #ececea; --muted: #9a9a94; --border: #33332f; --accent: #5b8ff0; --danger: #ef6b60; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  form { width: 100%; max-width: 320px; padding: 28px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; display: grid; gap: 14px; }
  h1 { margin: 0; font-size: 20px; }
  input { width: 100%; padding: 10px 12px; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { padding: 10px; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
  #error { margin: 0; color: var(--danger); font-size: 14px; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Media Browser</h1>
  <input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required>
  <p id="error" hidden>Wrong password, try again.</p>
  <button type="submit">Log in</button>
</form>
<script>
  if (location.search.includes('error')) document.getElementById('error').hidden = false;
</script>
</body>
</html>
