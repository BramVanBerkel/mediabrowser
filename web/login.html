<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Media Browser</title>
<script>
  try {
    const t = localStorage.getItem('theme');
    if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  } catch {}
</script>
<style>
  @font-face { font-family: "Inter"; font-weight: 100 900; font-display: swap; src: url("/static/fonts/inter.woff2") format("woff2"); }
  :root {
    --background: oklch(1 0 0); --foreground: oklch(0.129 0.042 264.695); --card: oklch(1 0 0);
    --primary: oklch(0.208 0.042 265.755); --primary-foreground: oklch(0.984 0.003 247.858);
    --muted: oklch(0.968 0.007 247.896); --muted-foreground: oklch(0.554 0.046 257.417);
    --border: oklch(0.929 0.013 255.508); --input: oklch(0.929 0.013 255.508);
    --destructive: oklch(0.577 0.245 27.325); color-scheme: light;
  }
  .dark {
    --background: oklch(0.129 0.042 264.695); --foreground: oklch(0.984 0.003 247.858); --card: oklch(0.208 0.042 265.755);
    --primary: oklch(0.929 0.013 255.508); --primary-foreground: oklch(0.208 0.042 265.755);
    --muted: oklch(0.279 0.041 260.031); --muted-foreground: oklch(0.704 0.04 256.788);
    --border: oklch(1 0 0 / 10%); --input: oklch(1 0 0 / 15%);
    --destructive: oklch(0.704 0.191 22.216); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--background); color: var(--foreground); font: 14px/1.43 "Inter", ui-sans-serif, system-ui, sans-serif; }
  form { width: 100%; max-width: 320px; padding: 24px; background: var(--card); border: 1px solid var(--border); display: grid; gap: 16px; }
  h1 { margin: 0; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted-foreground); }
  input { width: 100%; padding: 8px 12px; font: inherit; font-size: 16px; color: inherit; background: color-mix(in oklab, var(--muted) 40%, transparent); border: 1px solid var(--input); border-radius: 0; outline: none; }
  input:focus { border-color: color-mix(in oklab, var(--foreground) 40%, transparent); }
  button { padding: 8px 12px; font: inherit; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--primary-foreground); background: var(--primary); border: 0; cursor: pointer; }
  button:hover { opacity: .9; }
  #error { margin: 0; color: var(--destructive); font-size: 12px; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Media Browser</h1>
  <input type="password" name="password" placeholder="Password" aria-label="Password" autocomplete="current-password" autofocus required>
  <p id="error" hidden>Wrong password, try again.</p>
  <button type="submit">Log in</button>
</form>
<script>
  if (location.search.includes('error')) document.getElementById('error').hidden = false;
</script>
</body>
</html>
