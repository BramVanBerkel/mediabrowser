<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Media Browser</title>
<script>
  // Apply the saved theme before the first paint, so the page never flashes.
  try {
    const t = localStorage.getItem('theme');
    if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  } catch {}
</script>
<link rel="preload" href="/static/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header id="toolbar">
  <label class="search">
    <i data-icon="search"></i>
    <input id="search" type="search" placeholder="Search files and folders…" autocomplete="off" enterkeyhint="search" aria-label="Search file names">
  </label>
  <div class="controls">
    <div class="group">
      <span class="mobile-label">Sort</span>
      <select id="sort" aria-label="Sort by">
        <option value="name">Name</option>
        <option value="modified">Modified</option>
        <option value="size">Size</option>
        <option value="type">Type</option>
      </select>
      <button id="sort-dir" class="icon-btn" type="button"></button>
    </div>
    <span class="divider" aria-hidden="true"></span>
    <div class="right">
      <label class="icon-btn group" id="upload-btn" title="Upload files to this folder">
        <i data-icon="upload"></i>
        <span class="mobile-label">Upload</span>
        <input type="file" id="file-input" multiple hidden aria-label="Upload files">
      </label>
      <span class="divider" aria-hidden="true"></span>
      <div class="group">
        <button id="view-grid" class="icon-btn" type="button" aria-label="Grid view"><i data-icon="layout-grid"></i></button>
        <button id="view-list" class="icon-btn" type="button" aria-label="List view"><i data-icon="list"></i></button>
      </div>
    </div>
    <span class="divider" aria-hidden="true"></span>
    <div class="theme">
      <button id="theme-btn" class="icon-btn" type="button" aria-label="Theme" aria-haspopup="menu" aria-expanded="false"></button>
      <div id="theme-menu" role="menu" hidden>
        <button type="button" role="menuitemradio" data-theme="system"><i data-icon="monitor"></i>System</button>
        <button type="button" role="menuitemradio" data-theme="light"><i data-icon="sun"></i>Light</button>
        <button type="button" role="menuitemradio" data-theme="dark"><i data-icon="moon"></i>Dark</button>
      </div>
    </div>
  </div>
</header>

<nav id="crumbs" aria-label="Folder path"></nav>

<section id="uploads" hidden></section>

<div class="layout">
  <main>
    <div id="items"></div>
    <div id="empty" hidden>
      <i data-icon="folder"></i>
      <p id="empty-text"></p>
    </div>
    <p id="note" hidden></p>
    <p id="count" hidden></p>
  </main>
  <aside id="details" hidden aria-label="Details"></aside>
</div>

<div id="drop" hidden><div>Drop files to upload here</div></div>

<div id="viewer" hidden tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="v-title">
  <header class="v-bar">
    <h2 id="v-title"></h2>
    <span id="v-count"></span>
    <a id="v-download" class="v-btn" aria-label="Download" title="Download" download><i data-icon="download"></i></a>
    <button id="v-close" class="v-btn" type="button" aria-label="Close preview" title="Close preview (Esc)"><i data-icon="x"></i></button>
  </header>
  <div id="v-stage">
    <div id="v-plane"></div>
    <button id="v-prev" class="v-btn v-nav" type="button" aria-label="Previous" title="Previous"><i data-icon="chevron-left"></i></button>
    <button id="v-next" class="v-btn v-nav" type="button" aria-label="Next" title="Next"><i data-icon="chevron-right"></i></button>
  </div>
  <footer class="v-bar">
    <span id="v-info"><span id="v-kind"></span><span id="v-size"></span></span>
    <div id="v-zoom" role="group" aria-label="Image zoom">
      <button id="v-zoom-out" class="v-btn" type="button" aria-label="Zoom out" title="Zoom out (−)"><i data-icon="zoom-out"></i></button>
      <output id="v-zoom-level" aria-label="Zoom level">100%</output>
      <button id="v-zoom-in" class="v-btn" type="button" aria-label="Zoom in" title="Zoom in (+)"><i data-icon="zoom-in"></i></button>
      <button id="v-zoom-reset" class="v-btn" type="button" aria-label="Reset zoom" title="Fit image (0)"><i data-icon="rotate-ccw"></i></button>
    </div>
  </footer>
</div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
